<!doctype html>
<html lang="en-AU">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta charset="utf-8">
<title>The Service Edit</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://theserviceedit.com/services.html">
<meta http-equiv="refresh" content="0; url=services.html">
<script>location.replace('services.html');</script>
<!-- tse-protect -->
<style>
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
img,picture,video,svg{-webkit-user-drag:none;user-drag:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>
<script>
(function(){
  var media='img,picture,video,svg,[style*="background-image"]';
  document.addEventListener('contextmenu',function(e){if(e.target.closest(media))e.preventDefault();});
  document.addEventListener('dragstart',function(e){if(e.target.closest(media))e.preventDefault();});
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
  document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300)e.preventDefault();last=n;},{passive:false});
  document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault();},{passive:false});
  document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','=','-','_','0'].indexOf(e.key)>-1)e.preventDefault();});
})();
</script>
</head>
<body><p><a href="services.html">Services</a></p></body>
</html>
