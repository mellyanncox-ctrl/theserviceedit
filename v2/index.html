<!doctype html>
<html lang="en-AU"><head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta charset="utf-8">
<title>The Service Edit</title>
<link rel="canonical" href="https://theserviceedit.com/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=/">
<!-- tse-protect v2 -->
<style>
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
body{-webkit-touch-callout:none}
img,picture,video,svg,canvas{-webkit-user-drag:none;user-drag:none;-webkit-user-select:none;user-select:none}
</style>
<script>
(function(){
  function isImage(el){
    for(;el&&el.nodeType===1;el=el.parentElement){
      if(/^(IMG|PICTURE|VIDEO|SVG|CANVAS|FIGURE)$/i.test(el.tagName))return true;
      var bg=getComputedStyle(el).backgroundImage;
      if(bg&&bg!=='none')return true;
      if(el.querySelector&&el.querySelector(':scope > img, :scope > picture, :scope > video'))return true;
    }
    return false;
  }
  document.addEventListener('contextmenu',function(e){if(isImage(e.target))e.preventDefault();});
  document.addEventListener('dragstart',function(e){if(isImage(e.target))e.preventDefault();});
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
  document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300)e.preventDefault();last=n;},{passive:false});
  document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault();},{passive:false});
  document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','=','-','_','0','s','S'].indexOf(e.key)>-1)e.preventDefault();});
})();
</script>
</head><body><a href="/">theserviceedit.com</a></body></html>
